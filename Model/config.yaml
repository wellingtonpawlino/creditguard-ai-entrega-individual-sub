split:
  test_size:    0.20
  random_state: 42

models:
  dummy:
    strategy:     prior
    random_state: 42

  logistic_regression:
    max_iter:     1000
    class_weight: balanced
    solver:       liblinear
    random_state: 42

  random_forest:
    n_estimators:      400
    max_depth:         14
    min_samples_split: 40
    min_samples_leaf:  20
    max_features:      sqrt
    class_weight:      balanced_subsample
    random_state:      42
    n_jobs:            -1

  xgboost:
    n_estimators:      600
    max_depth:         5
    learning_rate:     0.05
    subsample:         0.80
    colsample_bytree:  0.80
    min_child_weight:  20
    reg_alpha:         0.10
    reg_lambda:        1.00
    random_state:      42
    n_jobs:            -1
    tree_method:       hist

  lightgbm:
    n_estimators:      700
    learning_rate:     0.04
    num_leaves:        31
    max_depth:         -1
    subsample:         0.80
    colsample_bytree:  0.80
    min_child_samples: 40
    reg_alpha:         0.10
    reg_lambda:        1.00
    class_weight:      balanced
    random_state:      42
    n_jobs:            -1

artifacts:
  preprocessor:     Model/artifacts/preprocessor.joblib
  model:            Model/artifacts/best_model.joblib
  features:         Model/artifacts/features.joblib
  all_models:       Model/artifacts/all_models.joblib
  predictions_test: Model/artifacts/predictions_test.joblib
  comparison:       Model/artifacts/comparacao_modelos.csv
  metadata:         Model/artifacts/metadata_modelo.json

minio:
  bucket:  model-artifacts
  version: v3
  objects:
    preprocessor: preprocessor.joblib
    model:        best_model.joblib
    features:     features.joblib
