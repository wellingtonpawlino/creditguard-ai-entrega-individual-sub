x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://creditguard:creditguard@postgres:5432/airflow"
    AIRFLOW__CORE__FERNET_KEY: "XQ12y010quN37ZzoYCmvLz7VmMKxZnAsZ2y6vUBx_SQ="
    AIRFLOW__WEBSERVER__SECRET_KEY: creditguard-secret
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./DataPipeline:/opt/airflow/DataPipeline
    - ./Model:/opt/airflow/Model
    - ./utils:/opt/airflow/utils
    - ./Dados:/opt/airflow/Dados
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  creditguard-app:
    build:
      context: .
      dockerfile: MLOps/app/Dockerfile
    ports:
      - "8501:8501"
    container_name: creditguard-ai
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MODEL_VERSION=v3
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=creditguard
      - POSTGRES_USER=creditguard
      - POSTGRES_PASSWORD=creditguard
      - OMP_NUM_THREADS=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - CRM_WEBHOOK_URL=${CRM_WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_FROM=${SMTP_FROM:-creditguard@local}
      - ANALISTA_EMAIL=${ANALISTA_EMAIL:-analista@local}
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: creditguard-minio
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: creditguard-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/raw-data &&
      mc mb --ignore-existing local/processed-data &&
      mc mb --ignore-existing local/model-artifacts &&
      echo 'Buckets criados com sucesso.'
      "

  postgres:
    image: postgres:16-alpine
    container_name: creditguard-postgres
    environment:
      - POSTGRES_DB=creditguard
      - POSTGRES_USER=creditguard
      - POSTGRES_PASSWORD=creditguard
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    container_name: creditguard-airflow-init
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@creditguard.ai || true"
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: creditguard-airflow-webserver
    command: webserver
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: creditguard-airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  minio_data:
  postgres_data:
  airflow_logs:
